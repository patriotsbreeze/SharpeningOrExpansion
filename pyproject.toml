[project]
name = "soe"
version = "0.1.0"
description = "Sharpening or Expansion? A confound decomposition of the pass@k crossover in RLVR."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "zstandard>=0.22",
    "jinja2>=3.1",
    "PyYAML>=6.0",
    "boto3>=1.34",
    "datasets>=2.19",
    "transformers>=4.44",
    "math-verify[antlr4_13_2]==0.9.0",
    "pebble>=5.0",
    "sympy>=1.12",
    "matplotlib>=3.8",
]

# GPU deps are isolated so the authoring/CI environment never installs torch or vllm.
# `uv sync` gives the CPU-testable pipeline; `uv sync --extra gpu` is only ever run on the node.
[project.optional-dependencies]
gpu = ["vllm==0.29.0", "torch"]
dev = ["pytest>=8.0", "pytest-xdist", "ruff>=0.5", "hypothesis>=6.100"]

[project.scripts]
soe = "soe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soe"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running statistical validations",
    "gpu: requires a GPU and real weights; skipped in CI",
]
addopts = "-m 'not gpu'"
